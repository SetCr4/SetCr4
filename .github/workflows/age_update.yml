name: AGE_UPDATE

on:
  workflow_dispatch:
  schedule:
   - cron: "0 1 */5 * *"

jobs:
  age_update:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Run Script
        env:
          DOB: ${{ secrets.DOB }}
        run: python .github/scripts/agescript.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "Automatic age update"
            git push
          else
            echo "No changes to commit"
          fi